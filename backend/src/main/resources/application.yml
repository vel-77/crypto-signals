# =================================================================================================
# crypto-signals - default configuration
#
# Every detection rule lives here; nothing in the engine is hardcoded. Values can be overridden per
# environment with standard Spring mechanisms: an application-<profile>.yml, SPRING_APPLICATION_JSON,
# or environment variables such as CRYPTO_SIGNALS_ANALYSIS_MIN_TOUCHES=4 (every dash of the
# property name becomes an underscore; a run-together CRYPTO_SIGNALS_ANALYSIS_MINTOUCHES is ignored).
#
# Relaxed binding means both `min-touches` and `minTouches` are accepted.
# =================================================================================================

spring:
  application:
    name: crypto-signals
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptosignals}
    username: ${DB_USERNAME:cryptosignals}
    password: ${DB_PASSWORD:cryptosignals}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: crypto-signals-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches.
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cryptosignals: ${LOG_LEVEL:INFO}

crypto-signals:

  # -----------------------------------------------------------------------------------------------
  # Which series to analyse. The watch list is the cross product of the watched symbols x
  # timeframes; each pair is an independent engine producing independent signals. The watched
  # symbols are `symbols` (always watched) plus, with volume-selection on, the most traded other
  # coins, refreshed while running.
  # -----------------------------------------------------------------------------------------------
  markets:
    symbols:                        # always watched, whatever their volume
      - BTCUSDT
      - ETHUSDT
    volume-selection:
      enabled: false                # docker-compose turns this on
      quote-asset: USDT
      min-daily-volume: 5000000     # average traded value per day a coin needs to join, in USDT
      window: 7d                    # volume is averaged over this; Binance reports at most 7d
      max-symbols: 50               # most coins watched in all, fixed symbols included; 0 = no limit
      keep-percent: 70              # a watched coin stays until it falls below 70% of what joining takes
      min-price-range-percent: 1.0  # skip coins that moved less than this over the window
      exclude-tags: [stablecoin, bStocks, tCommodities]   # Binance's tags: stablecoins, stocks, gold
      exclude-assets: [EUR, WBTC, WBETH, BNSOL]           # fiat, wrapped and staked copies
      refresh-interval: 24h
      retry-interval: 15m           # after the exchange could not be asked
    timeframes:
      - 15m
      - 30m
      - 1h
    lookback: 30d                   # 24h / 7d / 30d / 90d / 365d; 0 means all available history
    max-candles-per-backfill: 200000
    backfill-on-startup: true
    live-enabled: true
    reconciliation-interval: 15m

  # -----------------------------------------------------------------------------------------------
  # Exchange connectivity.
  # -----------------------------------------------------------------------------------------------
  exchange:
    name: BINANCE
    rest-base-url: ${BINANCE_REST_URL:https://api.binance.com}
    ws-base-url: ${BINANCE_WS_URL:wss://stream.binance.com:9443}
    connect-timeout: 10s
    read-timeout: 30s
    kline-page-size: 1000
    max-weight-per-minute: 2400
    max-retries: 5
    retry-backoff: 1s
    reconnect-min-backoff: 1s
    reconnect-max-backoff: 2m
    stream-stale-after: 90s         # no data for this long means the live connection is dead
    # Binance's public product list: the only source of its stablecoin / stock / commodity tags.
    # Empty disables the lookup (and with it markets.volume-selection.exclude-tags).
    symbol-tags-url: https://www.binance.com/bapi/asset/v2/public/asset-service/product/get-products?includeEtf=true

  # -----------------------------------------------------------------------------------------------
  # The detection rules. See docs/ALGORITHM.md for what each one means and why it exists.
  # -----------------------------------------------------------------------------------------------
  analysis:
    # --- automatic level discovery
    swing-left-bars: 3              # candles a swing must dominate on its left
    swing-right-bars: 3             # ... and on its right; also the confirmation delay
    level-price-aggregation: MEAN   # MEAN | MEDIAN | EXTREME
    cluster-tolerance-percent: 0.15 # how close a new swing must be to join an existing level

    # --- zone width: what counts as "the same price"
    tolerance-mode: PERCENT         # PERCENT | ATR | MAX_OF_BOTH
    touch-tolerance-percent: 0.1    # 100000 -> zone 99900 .. 100100
    atr-tolerance-multiplier: 0.25
    atr-period: 14

    # --- what makes two touches separate
    touch-mode: WICK                # WICK | BODY | CLOSE
    min-candles-between-touches: 10
    min-departure-percent: 0.3      # price must travel this far from the level between touches
    min-time-between-touches: 0s    # optional extra wall-clock separation; 0 disables

    # --- what counts as a breakout
    breakout-tolerance-percent: 0.2 # must exceed touch-tolerance-percent
    confirmation-candles: 1         # consecutive qualifying candles required
    close-beyond-level: true        # the close must clear the threshold
    wick-break-allowed: false       # a wick alone does not break the level

    # --- signalling
    min-touches: 3                  # the "3" in 3-touch
    signal-trigger: ON_TOUCH        # ON_TOUCH | ON_CONFIRMED_REJECTION
    min-level-strength: 0.0         # 0..1 quality gate
    emit-signal-on-every-touch-after-min: true   # signal again on touch 4, 5, ... not only on touch 3

    # --- level lifecycle
    max-active-levels-per-market: 250
    level-expiry-candles: 0         # 0 disables ageing out
    enable-role-flip: false         # broken resistance immediately becomes support

    # --- supersede rules: hide a level in favour of a nearby level of the same role (SUPERSEDED,
    #     not broken). Both rules use the per-timeframe gap below.
    supersede-enabled: true          # master switch for both rules
    # Proximity: established levels (>= min-touches) whose neighbouring gaps are all within the
    # limit form one group; only the highest resistance / lowest support of it stays active.
    supersede-nearby-levels: true
    # Price: once price is past a level and an established level just beyond it is nearer to
    # price, the passed level is retired.
    supersede-on-price-pass: true
    supersede-max-distance-percent: "15m:0.5,30m:0.6,1h:0.75,4h:1.5"
    supersede-default-max-distance-percent: 0.5   # timeframes not listed above

    # --- strength scoring weights
    strength-touch-weight: 0.5
    strength-rejection-weight: 0.3
    strength-span-weight: 0.2

  # -----------------------------------------------------------------------------------------------
  # Next potential low / high, shown with every signal: the nearest earlier swing low below a
  # support signal (swing high above a resistance signal) that is at least min-distance-percent
  # away. Swings use the same rule as level detection, and only those already confirmed when the
  # signal fired count. Changing a setting recomputes every stored signal on the next start.
  # -----------------------------------------------------------------------------------------------
  next-potential:
    min-distance-percent: 1.0       # ignore swings closer to the signal price than this
    lookback: 30d                   # how far back before the signal to look; 0 means all stored history

  # -----------------------------------------------------------------------------------------------
  # Notifications. Telegram is the first channel; the abstraction takes more.
  # -----------------------------------------------------------------------------------------------
  notifications:
    notify-historical: false        # do not replay a year of old signals into the chat on startup
    max-signal-age: 1h              # never deliver a signal older than this; 0 disables the check
    retry-interval: 1m
    timezone: ${NOTIFICATIONS_TIMEZONE:UTC}   # times in Telegram messages, e.g. Asia/Yerevan
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
      api-base-url: https://api.telegram.org
      timeout: 10s
