# =================================================================================================
# crypto-signals - full local or single-host deployment
#
#   docker compose up -d --build
#
#   UI      http://localhost:3000
#   API     http://localhost:8080/api
#   Swagger http://localhost:8080/swagger-ui.html
#
# Copy .env.example to .env first; every value below has a working default except the Telegram
# credentials, which stay empty and simply leave that channel switched off.
# =================================================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptosignals}
      POSTGRES_USER: ${POSTGRES_USER:-cryptosignals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptosignals}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # The app waits for this, so a slow first start never produces a misleading crash loop.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptosignals} -d ${POSTGRES_DB:-cryptosignals}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: cs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cryptosignals}
      DB_USERNAME: ${POSTGRES_USER:-cryptosignals}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cryptosignals}
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Spring reads CRYPTO_SIGNALS_<SECTION>_<SETTING> with every dash of the property name as an
      # underscore (min-touches -> MIN_TOUCHES). Run-together names such as ..._MINTOUCHES are
      # silently ignored; EnvironmentBindingTest checks every name below.

      # Watch list and history depth
      CRYPTO_SIGNALS_MARKETS_SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT}
      CRYPTO_SIGNALS_MARKETS_TIMEFRAMES: ${TIMEFRAMES:-15m,30m,1h}
      CRYPTO_SIGNALS_MARKETS_LOOKBACK: ${LOOKBACK:-30d}
      CRYPTO_SIGNALS_MARKETS_VOLUME_SELECTION_ENABLED: ${VOLUME_SELECTION:-true}
      CRYPTO_SIGNALS_MARKETS_VOLUME_SELECTION_MIN_DAILY_VOLUME: ${MIN_DAILY_VOLUME:-5000000}
      CRYPTO_SIGNALS_MARKETS_VOLUME_SELECTION_MAX_SYMBOLS: ${MAX_SYMBOLS:-50}

      # Detection rules (see docs/ALGORITHM.md before changing these)
      CRYPTO_SIGNALS_ANALYSIS_MIN_TOUCHES: ${MIN_TOUCHES:-3}
      CRYPTO_SIGNALS_ANALYSIS_TOUCH_TOLERANCE_PERCENT: ${TOUCH_TOLERANCE_PERCENT:-0.1}
      CRYPTO_SIGNALS_ANALYSIS_BREAKOUT_TOLERANCE_PERCENT: ${BREAKOUT_TOLERANCE_PERCENT:-0.2}
      CRYPTO_SIGNALS_ANALYSIS_MIN_CANDLES_BETWEEN_TOUCHES: ${MIN_CANDLES_BETWEEN_TOUCHES:-10}
      CRYPTO_SIGNALS_ANALYSIS_CONFIRMATION_CANDLES: ${CONFIRMATION_CANDLES:-1}
      CRYPTO_SIGNALS_ANALYSIS_EMIT_SIGNAL_ON_EVERY_TOUCH_AFTER_MIN: ${SIGNAL_ON_EVERY_TOUCH:-true}
      CRYPTO_SIGNALS_ANALYSIS_SUPERSEDE_ENABLED: ${SUPERSEDE_ENABLED:-true}
      CRYPTO_SIGNALS_ANALYSIS_SUPERSEDE_NEARBY_LEVELS: ${SUPERSEDE_NEARBY_LEVELS:-true}
      CRYPTO_SIGNALS_ANALYSIS_SUPERSEDE_ON_PRICE_PASS: ${SUPERSEDE_ON_PRICE_PASS:-true}
      CRYPTO_SIGNALS_ANALYSIS_SUPERSEDE_MAX_DISTANCE_PERCENT: ${SUPERSEDE_MAX_DISTANCE:-15m:0.5,30m:0.6,1h:0.75,4h:1.5}
      CRYPTO_SIGNALS_NEXT_POTENTIAL_MIN_DISTANCE_PERCENT: ${NEXT_POTENTIAL_MIN_DISTANCE:-1.0}
      CRYPTO_SIGNALS_NEXT_POTENTIAL_LOOKBACK: ${NEXT_POTENTIAL_LOOKBACK:-30d}

      # Notifications (leave the token empty to keep Telegram switched off)
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFICATIONS_TIMEZONE: ${NOTIFICATIONS_TIMEZONE:-UTC}

      CRYPTO_SIGNALS_API_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: cs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
